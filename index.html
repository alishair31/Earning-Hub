<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn App - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .app-container {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      color: #1a1a2e;
    }

    .points-badge {
      background: linear-gradient(135deg, #ffd700, #ffb347);
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: bold;
      color: #1a1a2e;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(255, 180, 0, 0.4);
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin: 20px 0 12px;
      color: #2d3436;
      border-left: 5px solid #6c5ce7;
      padding-left: 10px;
    }

    /* Watch & Earn Section */
    .ads-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ad-card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: 0.2s;
      border: 1px solid #e0e0e0;
    }

    .ad-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .ad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ad-name {
      font-weight: 600;
      font-size: 16px;
      color: #2d3436;
    }

    .ad-limit {
      font-size: 13px;
      color: #636e72;
      background: #eee;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      border-radius: 10px;
      transition: width 0.3s;
      width: 0%;
    }

    .watch-btn {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      font-size: 14px;
    }

    .watch-btn:hover:not(:disabled) {
      background: #5f3dc4;
    }

    .watch-btn:disabled {
      background: #b2bec3;
      cursor: not-allowed;
    }

    /* Spin Section */
    .wheel-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0;
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 0 8px #fff, 0 0 0 12px #6c5ce7;
      transition: transform 4s cubic-bezier(0.25, 0.1, 0.15, 1);
      will-change: transform;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #e74c3c;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
      z-index: 10;
    }

    .spin-btn {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
      transition: 0.2s;
    }

    .spin-btn:disabled {
      background: #b2bec3;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Invite Section */
    .invite-card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      border: 1px dashed #6c5ce7;
      text-align: center;
    }

    .invite-link {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
      background: white;
    }

    .copy-btn {
      background: #00b894;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: #009e7c;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-box h3 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #2d3436;
    }

    .modal-box p {
      color: #636e72;
      margin-bottom: 20px;
    }

    .close-modal {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px 30px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d3436;
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>🏠 Home</h1>
      <div class="points-badge">🪙 <span id="totalPoints">0</span> Points</div>
    </div>

    <!-- Watch and Earn Section -->
    <div class="section-title">📺 Watch and Earn</div>
    <div class="ads-container">
      <!-- Simple Ads -->
      <div class="ad-card">
        <div class="ad-header">
          <span class="ad-name">Simple Ads</span>
          <span class="ad-limit" id="simpleLimitLabel">0/25</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="simpleProgress"></div>
        </div>
        <button class="watch-btn" id="simpleBtn">Watch Ad (+25 Points)</button>
      </div>

      <!-- Pro Ads -->
      <div class="ad-card">
        <div class="ad-header">
          <span class="ad-name">Pro Ads</span>
          <span class="ad-limit" id="proLimitLabel">0/25</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="proProgress"></div>
        </div>
        <button class="watch-btn" id="proBtn">Watch Ad (+25 Points)</button>
      </div>

      <!-- Sponsor Ads -->
      <div class="ad-card">
        <div class="ad-header">
          <span class="ad-name">Sponsor Ads</span>
          <span class="ad-limit" id="sponsorLimitLabel">0/25</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="sponsorProgress"></div>
        </div>
        <button class="watch-btn" id="sponsorBtn">Watch Ad (+25 Points)</button>
      </div>
    </div>

    <!-- Spin and Earn Section -->
    <div class="section-title">🎡 Spin and Earn</div>
    <div class="wheel-wrapper">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
      </div>
      <button class="spin-btn" id="spinBtn">SPIN NOW</button>
    </div>

    <!-- Invite and Ref Section -->
    <div class="section-title">👥 Invite & Ref</div>
    <div class="invite-card">
      <p style="margin-bottom: 5px; color: #2d3436;">अपना Referral Link शेयर करें</p>
      <input type="text" class="invite-link" id="refLink" value="https://example.com/ref?user=12345" readonly>
      <button class="copy-btn" id="copyBtn">📋 Copy Link</button>
      <p id="inviteCount" style="margin-top: 15px; color: #636e72;">Total Invites: 0</p>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalTitle">🎉 Result</h3>
      <p id="modalMessage"></p>
      <button class="close-modal" id="closeModal">Okay</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ==================== UTILITY FUNCTIONS ====================
    const $ = (id) => document.getElementById(id);
    const DAILY_LIMIT = 25;
    const POINTS_PER_AD = 25;

    // Get today's date as YYYY-MM-DD
    function getToday() {
      return new Date().toISOString().slice(0, 10);
    }

    // Show toast message
    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Show modal
    function showModal(title, message) {
      $('modalTitle').textContent = title;
      $('modalMessage').textContent = message;
      $('modalOverlay').style.display = 'flex';
    }

    // Hide modal
    $('closeModal').addEventListener('click', () => {
      $('modalOverlay').style.display = 'none';
    });

    // ==================== POINTS MANAGEMENT ====================
    let totalPoints = parseInt(localStorage.getItem('earnPoints') || '0');
    function updatePointsDisplay() {
      $('totalPoints').textContent = totalPoints;
      localStorage.setItem('earnPoints', totalPoints);
    }
    function addPoints(amount) {
      totalPoints += amount;
      updatePointsDisplay();
    }

    // ==================== DAILY AD LIMITS ====================
    let adData = JSON.parse(localStorage.getItem('adData') || '{}');
    // Structure: { date: 'YYYY-MM-DD', simple: 0, pro: 0, sponsor: 0 }

    function resetDailyIfNeeded() {
      const today = getToday();
      if (adData.date !== today) {
        adData = { date: today, simple: 0, pro: 0, sponsor: 0 };
        localStorage.setItem('adData', JSON.stringify(adData));
      }
    }

    function saveAdData() {
      localStorage.setItem('adData', JSON.stringify(adData));
    }

    function updateAdUI() {
      // Simple
      const simpleCount = adData.simple || 0;
      $('simpleLimitLabel').textContent = `${simpleCount}/${DAILY_LIMIT}`;
      $('simpleProgress').style.width = `${(simpleCount / DAILY_LIMIT) * 100}%`;
      $('simpleBtn').disabled = simpleCount >= DAILY_LIMIT;
      $('simpleBtn').textContent = simpleCount >= DAILY_LIMIT ? 'Limit Reached' : 'Watch Ad (+25 Points)';

      // Pro
      const proCount = adData.pro || 0;
      $('proLimitLabel').textContent = `${proCount}/${DAILY_LIMIT}`;
      $('proProgress').style.width = `${(proCount / DAILY_LIMIT) * 100}%`;
      $('proBtn').disabled = proCount >= DAILY_LIMIT;
      $('proBtn').textContent = proCount >= DAILY_LIMIT ? 'Limit Reached' : 'Watch Ad (+25 Points)';

      // Sponsor
      const sponsorCount = adData.sponsor || 0;
      $('sponsorLimitLabel').textContent = `${sponsorCount}/${DAILY_LIMIT}`;
      $('sponsorProgress').style.width = `${(sponsorCount / DAILY_LIMIT) * 100}%`;
      $('sponsorBtn').disabled = sponsorCount >= DAILY_LIMIT;
      $('sponsorBtn').textContent = sponsorCount >= DAILY_LIMIT ? 'Limit Reached' : 'Watch Ad (+25 Points)';
    }

    function watchAd(type) {
      resetDailyIfNeeded();
      const current = adData[type] || 0;
      if (current >= DAILY_LIMIT) {
        showToast('❌ Daily limit पूरी हो गई!');
        return;
      }
      adData[type] = current + 1;
      saveAdData();
      addPoints(POINTS_PER_AD);
      updateAdUI();
      showToast(`✅ ${type} Ad देखा! +${POINTS_PER_AD} Points`);
    }

    // Attach ad button events
    $('simpleBtn').addEventListener('click', () => watchAd('simple'));
    $('proBtn').addEventListener('click', () => watchAd('pro'));
    $('sponsorBtn').addEventListener('click', () => watchAd('sponsor'));

    // ==================== SPIN WHEEL ====================
    const canvas = $('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 130; // Leave margin for border

    // Segment definitions (order clockwise from top)
    const segments = [
      { label: '$25', weight: 1, type: 'display', points: 0, color: '#e74c3c' },
      { label: '$50', weight: 1, type: 'display', points: 0, color: '#9b59b6' },
      { label: '1000 Pts', weight: 2, type: 'points', points: 1000, color: '#f1c40f' },
      { label: '100 Pts', weight: 20, type: 'points', points: 100, color: '#2ecc71' },
      { label: '10 Pts', weight: 40, type: 'points', points: 10, color: '#3498db' },
      { label: '1 Pt', weight: 36, type: 'points', points: 1, color: '#e67e22' }
    ];

    const totalWeight = segments.reduce((sum, seg) => sum + seg.weight, 0);

    function drawWheel(rotationAngle = 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const startAngle = -Math.PI / 2; // Start from top
      const segmentAngle = (Math.PI * 2) / segments.length;

      segments.forEach((seg, i) => {
        const angleStart = startAngle + i * segmentAngle;
        const angleEnd = angleStart + segmentAngle;

        // Draw segment
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angleStart, angleEnd);
        ctx.closePath();
        ctx.fillStyle = seg.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angleStart + segmentAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Segoe UI';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 3;
        ctx.fillText(seg.label, radius - 10, 5);
        ctx.restore();
      });

      // Draw center circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#6c5ce7';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // Initial draw
    drawWheel();

    let isSpinning = false;
    let currentRotation = 0; // cumulative rotation in degrees

    function getWeightedRandomSegment() {
      let random = Math.random() * totalWeight;
      for (let i = 0; i < segments.length; i++) {
        random -= segments[i].weight;
        if (random <= 0) return i;
      }
      return segments.length - 1;
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      $('spinBtn').disabled = true;

      // Determine winning segment
      const winIndex = getWeightedRandomSegment();
      const winSegment = segments[winIndex];
      const segmentAngle = 360 / segments.length;
      const targetCenterAngle = winIndex * segmentAngle + segmentAngle / 2; // from top
      // We want to rotate so that targetCenterAngle is at top (0 degrees)
      // Current rotation mod 360
      const currentMod = currentRotation % 360;
      let delta = (360 - targetCenterAngle - currentMod + 360) % 360;
      // Add 5 full spins for effect
      const extraSpins = 5 * 360;
      const newRotation = currentRotation + extraSpins + delta;

      // Apply rotation
      canvas.style.transition = 'transform 4s cubic-bezier(0.25, 0.1, 0.15, 1)';
      canvas.style.transform = `rotate(${newRotation}deg)`;
      currentRotation = newRotation;

      // After animation ends
      setTimeout(() => {
        isSpinning = false;
        $('spinBtn').disabled = false;
        const msg = winSegment.type === 'points' 
          ? `🎉 आपको ${winSegment.points} Points मिले!` 
          : '😅 यह reward सिर्फ display के लिए है, कोई points नहीं मिले।';
        showModal('Spin Result', msg);
        if (winSegment.type === 'points') {
          addPoints(winSegment.points);
        }
      }, 4100);
    }

    $('spinBtn').addEventListener('click', spinWheel);

    // ==================== INVITE & REF ====================
    let invites = parseInt(localStorage.getItem('inviteCount') || '0');
    $('inviteCount').textContent = `Total Invites: ${invites}`;

    $('copyBtn').addEventListener('click', () => {
      const refInput = $('refLink');
      refInput.select();
      refInput.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(refInput.value).then(() => {
        showToast('📋 Referral link copied!');
        // Simulate new invite (for demo only)
        invites++;
        localStorage.setItem('inviteCount', invites);
        $('inviteCount').textContent = `Total Invites: ${invites}`;
      }).catch(() => {
        showToast('❌ Copy failed');
      });
    });

    // ==================== INIT ====================
    function init() {
      resetDailyIfNeeded();
      updateAdUI();
      updatePointsDisplay();
    }
    init();
  </script>
</body>
</html>
